[platformio]
src_dir=${PROJECT_DIR}/ecodan-ha-local

[env]
platform = espressif32 @ 8.0.0
framework = arduino
monitor_speed = 115200
; for linux
monitor_port = /dev/ttyUSB0
upload_port  = /dev/ttyUSB0
; for osx
; monitor_port = /dev/cu.usbserial-0001
; upload_port  = /dev/cu.usbserial-0001
; for other platforms see: https://docs.platformio.org/en/latest/projectconf/sections/env/options/upload/upload_port.html
lib_deps =
	ArduinoJson @ 7.0.3
	MQTT @ 2.5.2
; Checks that the image fits into the OTA app partition and creates firmware-factory.bin
extra_scripts = post:tools/post_build.py

; Generic ESP32 dev kit (ESP32-WROOM-32 / ESP32-WROVER), at least 4 MB flash.
; Optimize for size (-Os): with the default (speed) the image no longer fits
; into the 1.25 MB OTA app partition of the default 4 MB partition table.
[env:esp32dev]
board = esp32dev
build_flags = -Os

[env:lolin_s2_mini]
board = lolin_s2_mini
; USB CDC console off (the firmware does not use Serial) -> saves ~69 KB flash (TinyUSB).
; Consequence: USB flashing only in bootloader mode (hold BOOT + press RST).
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
; Optimize for size (-Os), see above.
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0 -Os

; Test build to verify the automatic OTA rollback. Crashes in test mode after 45 s
; ONCE on purpose -> the bootloader must restore the previous firmware.
; NEVER use as regular firmware.
[env:lolin_s2_mini_crashtest]
extends = env:lolin_s2_mini
build_flags = ${env:lolin_s2_mini.build_flags} -DEHAL_OTA_CRASH_TEST -DEHAL_VERSION_SUFFIX=\"-crashtest\"
